
name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Zakuro-x86_64.AppImage"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
