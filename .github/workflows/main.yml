name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on any tag starting with v
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to create releases
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true # Automatically generates release notes from PRs/commits
          token: ${{ secrets.GITHUB_TOKEN }}
