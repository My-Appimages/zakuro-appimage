
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libfuse2

      - name: Download and Setup LinuxDeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod a+x linuxdeploy-x86_64.AppImage

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./build-appimage.sh

      - name: Execute Bash script
        run: ./build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakuro-appimage
          path: Zakuro-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: zakuro-appimage

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: Zakuro-x86_64.AppImage
